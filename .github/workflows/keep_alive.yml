name: Mantener Supabase Despierto

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Hacer consulta a la API de Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/productos?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Mantener activo el repositorio de GitHub (Auto-commit mensual)
        run: |
          echo "Última ejecución: $(date)" > last_ping.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_ping.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update ping timestamp" && git push)